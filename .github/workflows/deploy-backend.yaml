name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync repo (without frontend)
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '/.github' --exclude '/frontend' \
            --exclude '/backend/.env' --exclude '.venv' \
            --exclude '__pycache__' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            cd ~/app
            docker compose build
            docker compose up -d
            docker image prune -f
          '