name: Deploy backend

on:
  push:
    branches: [deploy-backend]
    paths: ["backend/**"]
  workflow_dispatch:

concurrency:
  group: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy-backend'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync backend/ to server
        run: |
          rsync -az --delete \
            --exclude '.venv' --exclude '.env' \
            --exclude '__pycache__' --exclude '.pytest_cache' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Install deps, migrate, restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            cd ~/app
            ~/.local/bin/uv pip sync requirements.txt
            .venv/bin/alembic upgrade head
            sudo systemctl restart fastapi
          '