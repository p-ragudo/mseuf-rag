[pytest]
; Adds the directory containing this file (backend/) to sys.path,
; so `from app.scraper.discovery.logic import ...` resolves correctly
; no matter which directory pytest is invoked from.
pythonpath = .

asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=app 
    --cov-report=term-missing 
    --cov-report=html:tests/coverage_html
    -v